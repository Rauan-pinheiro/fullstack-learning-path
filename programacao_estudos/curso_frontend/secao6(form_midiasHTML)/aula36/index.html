<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Executando Vídeos</title>
</head>
<body>
    <h1>Executando Vídeos</h1>
    <!-- 
    source -> fonte
    controls -> controles
    muted -> mutado
    autoplay -> reprodução automática 
    loop -> ciclo
    poster -> cartaz
    -->

    <video controls>
        <source src="videos/abelhas.mp4" type="video/mp4"> 
        Seu navegador não suporta vídeos MP4 
    </video>

    <iframe width="560" height="315" src="https://www.youtube-nocookie.com/embed/7PWyKkXw99I?si=SxMISOc0uuhWx2f5" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
    

</body>
</html>
