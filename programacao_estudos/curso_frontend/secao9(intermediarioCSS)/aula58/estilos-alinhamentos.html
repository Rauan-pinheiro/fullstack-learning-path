<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>estilo e alinhamento</title>

    <style>
        body{
            font-size: 1.5em;
            font-family: Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif;
        }

        h1{
            text-transform: uppercase;
        }

        .negrito{
            /*bold, normal, 100 até 900*/
            font-weight: bold;
        }

        .estilo{
            /*normal, italic, oblique*/
            font-style: italic;
        }

        .transformacao{
            /* uppercase, lowecase, capitalize */
            text-transform: uppercase;
        }

        .decoracao{
            /* none, underline, overline, line-through */
            text-decoration: line-through;
        }

        .entrelinhas{
            line-height: 2em;
            border: 3px solid red;
        }

        .espacamento{
            letter-spacing: 0.2em; /*espaçamento entre linhas*/
            word-spacing: 0.4em; /*espaçamento entre palavras*/
        }

        .recuo{
            text-indent: 2em;
        }

        .alinhamento{
            /*text-align: left, right, center, justify */
            text-align: center;
        }
    </style>
</head>
<body>

    <h1>Formatações de textos</h1>

    <p class="negrito">texto em negrito</p>
    <p class="estilo">texto com estilo</p>
    <p class="transformacao">texto com transformação</p>
    <p class="decoracao">texto com decoração</p>
    <p class="entrelinhas">texto entrelinhas</p>
    <p class="espacamento">texto com espaçamento entre letras e palavras</p>
    <p class="recuo">texto recuado</p>
    <p class="alinhamento">texto alinhado</p>
    <p>texto sem estilo algum</p>

</body>
</html>
