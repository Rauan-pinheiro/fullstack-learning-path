<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>O Elemento de Lista</title>
</head>
<body>

    <!-- 
    <ul></ul> lista não ordenada
    <ol></ol> lista ordenada
    <li></li> item da lista
    -->

    <h2>Lista não ordenada - (usada muito em MENUS)</h2>
    <ul>

        <li>
            carro
            <ul>
                <li>BMW</li>
            </ul>
        </li>

        
        <li>
            moto
            <ul>
                <li>cb500</li>
            </ul>
        </li>

    </ul>

    <h2>Lista ordenada (lista de compras)</h2>
    <ol>

        <li>
            pão
            <ol>
                <li>pão integral</li>
                <li>pão carioca</li>
            </ol>
        </li>

        <li>manteiga</li>
        <li>sanduicheira</li>
        
    </ol>

</body>
</html>
